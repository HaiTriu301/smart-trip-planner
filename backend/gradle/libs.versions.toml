# Central version catalog.
# Only third-party libraries and Gradle plugins get a version here.
# Libraries managed by the Spring Boot BOM (starters, lombok, mysql, flyway, testcontainers...)
# are declared without a version directly in build.gradle.

[versions]
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
mapstruct = "1.6.3"
lombok-mapstruct-binding = "0.2.0"
springdoc = "3.1.1"
jjwt = "0.12.6"

[libraries]
# jjwt-api + jjwt-impl only: jjwt-jackson would pull Jackson 2, the project runs Jackson 3 (design.md 3.1)
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
mapstruct-core = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }