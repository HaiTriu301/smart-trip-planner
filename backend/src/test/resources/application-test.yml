# Test profile: activated with @ActiveProfiles("test").
# The datasource is provided by Testcontainers through @ServiceConnection (TestcontainersConfiguration),
# so no connection settings or secrets are needed here.

spring:
  jpa:
    hibernate:
      ddl-auto: validate      # keep validate so tests catch entity/migration mismatches

app:
  frontend-url: http://localhost:5173
  providers:
    mail: mock                      # MockMailProvider keeps sent mail in memory for assertions; no SMTP needed
  jwt:
    # Test fixture, not a secret: it signs tokens that only live inside a test JVM
    secret: test-only-not-a-secret-0123456789abcdef0123456789abcdef0123456789abcdef