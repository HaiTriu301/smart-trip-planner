# User-facing messages (Vietnamese), resolved by ErrorCode.messageKey.
# File encoding MUST be UTF-8 (spring.messages.encoding in application.yml).
# Keep keys in sync with common/constant/ErrorCode.java (design.md 10.3).

# 400
error.validation=Dữ liệu không hợp lệ
error.validation.malformed-body=Nội dung yêu cầu không đúng định dạng JSON hoặc sai kiểu dữ liệu
error.validation.type-mismatch=Giá trị của tham số ''{0}'' không hợp lệ
error.invalid-token=Liên kết không hợp lệ hoặc đã hết hạn, vui lòng yêu cầu lại

# 401
error.unauthorized=Bạn cần đăng nhập để tiếp tục
error.token-expired=Phiên đăng nhập đã hết hạn
error.invalid-credentials=Email hoặc mật khẩu không đúng

# 402
error.quota-exceeded=Bạn đã vượt quá hạn mức của gói miễn phí
error.premium-required=Tính năng này chỉ dành cho tài khoản Premium

# 403
error.forbidden=Bạn không có quyền thực hiện thao tác này
error.email-not-verified=Email của bạn chưa được xác thực
error.account-blocked=Tài khoản đã bị khoá, vui lòng liên hệ hỗ trợ

# 404
error.resource-not-found=Không tìm thấy dữ liệu yêu cầu

# 405
error.method-not-allowed=Phương thức HTTP không được hỗ trợ cho đường dẫn này

# 409
error.email-already-exists=Email đã được sử dụng
error.activity-time-conflict=Hoạt động bị trùng giờ với một hoạt động khác trong ngày
error.stale-version=Dữ liệu đã bị người khác thay đổi, vui lòng tải lại

# 429
error.rate-limit-exceeded=Bạn gửi quá nhiều yêu cầu, vui lòng thử lại sau

# 500 / 502 / 503
error.internal=Đã có lỗi xảy ra, vui lòng thử lại sau
error.payment-failed=Thanh toán không thành công
error.provider-unavailable=Dịch vụ bên ngoài tạm thời không khả dụng, vui lòng thử lại sau

# Bean Validation messages for request DTOs (referenced as {key} in constraint annotations).
# {min}/{max} are filled in by Hibernate Validator after the key is resolved.
validation.email.required=Email không được để trống
validation.email.invalid=Email không đúng định dạng
validation.email.too-long=Email không được vượt quá {max} ký tự
validation.password.required=Mật khẩu không được để trống
validation.password.length=Mật khẩu phải dài từ {min} đến {max} ký tự
validation.password.weak=Mật khẩu phải có ít nhất một chữ hoa, một chữ thường, một chữ số và không chứa khoảng trắng
validation.password.confirm-required=Vui lòng nhập lại mật khẩu
validation.password.mismatch=Mật khẩu xác nhận không khớp
validation.full-name.required=Họ tên không được để trống
validation.full-name.too-long=Họ tên không được vượt quá {max} ký tự
validation.token.required=Thiếu mã xác thực
validation.trip.title.required=Tên chuyến đi không được để trống
validation.trip.title.too-long=Tên chuyến đi không được vượt quá {max} ký tự
validation.trip.description.too-long=Mô tả không được vượt quá {max} ký tự
validation.trip.cover-image-url.too-long=Đường dẫn ảnh bìa không được vượt quá {max} ký tự
validation.trip.cover-image-url.invalid=Đường dẫn ảnh bìa phải bắt đầu bằng http:// hoặc https://
validation.trip.destination-name.too-long=Tên điểm đến không được vượt quá {max} ký tự
validation.trip.latitude.range=Vĩ độ phải nằm trong khoảng -90 đến 90
validation.trip.longitude.range=Kinh độ phải nằm trong khoảng -180 đến 180
validation.trip.coordinate.precision=Toạ độ có tối đa 7 chữ số thập phân
validation.trip.start-date.required=Ngày bắt đầu không được để trống
validation.trip.end-date.required=Ngày kết thúc không được để trống
validation.trip.budget.negative=Ngân sách không được âm
