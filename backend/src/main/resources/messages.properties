validation.trip.currency.invalid=Mã tiền tệ phải gồm 3 chữ cái in hoa, ví dụ VND hoặc USD
validation.trip.query.too-long=Từ khoá tìm kiếm không được vượt quá {max} ký tự

# Business-rule field errors (BusinessRuleException + FieldViolation), MessageFormat placeholders {0}, {1}...
error.trip.end-before-start=Ngày kết thúc phải bằng hoặc sau ngày bắt đầu
error.trip.too-long=Chuyến đi dài tối đa {0} ngày
error.trip.coordinates-incomplete=Cần nhập đủ cả vĩ độ và kinh độ, hoặc bỏ trống cả hai
error.trip.sort-unsupported=Chỉ được sắp xếp theo: {0}

