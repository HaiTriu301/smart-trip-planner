# Shared configuration for every profile.
# Environment-specific values (datasource, secrets, URLs) live in application-{profile}.yml.

spring:
  application:
    name: trip-planner
  threads:
    virtual:
      enabled: true               # @Async (mail) and request handling run on virtual threads (design.md 3.1)
  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway - never update/create here
    open-in-view: false       # no lazy loading outside transactions
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100      # ?size=500 is silently capped (design.md 10.2 "Quy ước Trip API")
    redis:
      # Redis holds temporary copies of answers from outside sources, never data of its own (design.md 8.1).
      # REDIS_HOST / REDIS_PORT come from .env; the defaults are those of docker-compose.yml
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # How long a request waits for Redis before the cache step is skipped (CacheConfig.errorHandler). The
      # client's own default is 60 s: with Redis unreachable every cached request would hang that long
      connect-timeout: 1s
      timeout: 1s
      repositories:
        enabled: false          # entities live in MySQL only: no Spring Data repository is backed by Redis
  http:
    clients:
      # Every call to an outside service gives up after these limits instead of keeping the user waiting
      # (design.md 7.3). They apply to the RestClient.Builder the real providers are built from
      connect-timeout: 2s
      read-timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages                # src/main/resources/messages.properties
    encoding: UTF-8                   # Vietnamese user-facing messages (CLAUDE.md rule 14)
    fallback-to-system-locale: false  # unknown locale -> messages.properties, not the server OS locale

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json
  paths-to-match: /api/**             # document the public API only, hide actuator

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      # Redis only holds temporary copies (design.md 8.1): the application works without it, so a Redis that
      # is down must not make /actuator/health answer DOWN and take the application out of service
      enabled: false

app:
  mail-from: no-reply@smart-trip-planner.local
  jwt:
    secret: ${JWT_SECRET}        # >= 64 chars, never committed (see .env.example)
    access-ttl: 15m
    refresh-ttl: 7d
    issuer: smart-trip-planner
    cookie-secure: false         # prod profile sets true (cookie only over HTTPS)
  # Third-party implementations, selected by config (design.md 7.1).
  # Every profile defaults to mock so the app runs without any API key.
  providers:
    map: mock        # mock | osm
    weather: mock    # mock | open-meteo
    payment: mock    # mock | stripe
    ai: mock         # mock | claude
    storage: local   # local | cloudinary
    mail: mock       # mock | smtp  (local profile switches to smtp → MailHog; smtp needs spring.mail.host)
    # Sent as User-Agent with every call to an outside service: the public OpenStreetMap services and
    # Open-Meteo ask applications to say who they are (design.md 7.2). Not a secret
    user-agent: smart-trip-planner/0.1 (+https://github.com/HaiTriu301/smart-trip-planner)
    open-meteo:
      base-url: https://api.open-meteo.com   # weather forecast, used when weather = open-meteo
    # Used when map = osm. Public servers with fair-use terms; Nominatim: at most one call a second and never
    # for suggestions while typing, which is why search goes to Photon (design.md 7.2)
    osm:
      photon-base-url: https://photon.komoot.io               # search places by keyword
      nominatim-base-url: https://nominatim.openstreetmap.org # one place by its OpenStreetMap id
      osrm-base-url: https://router.project-osrm.org          # travel by road; this server routes cars only

# What happens around a call to a real outside service (design.md 7.3). One instance per service, named in the
# annotations of the providers: a service that is down does not stop the others. Unused while every provider
# is a mock. The time limit of a single call is spring.http.clients above
resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3            # the first call and two more
        wait-duration: 500ms
        # Only a 5xx status, no answer in time, no connection. A 4xx or an unreadable answer is not tried again
        retry-exception-predicate: com.trieu.tripplanner.provider.resilience.TransientFailure
    instances:
      photon:
        base-config: default
      nominatim:
        base-config: default
      osrm:
        base-config: default
      open-meteo:
        base-config: default
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20                 # the 20 most recent calls...
        minimum-number-of-calls: 10             # ...judged from the 10th on
        failure-rate-threshold: 50              # half of them failed: stop calling, fail at once
        wait-duration-in-open-state: 30s        # then let a few calls through to see if the service is back
        permitted-number-of-calls-in-half-open-state: 2
        # A call counts as failed when the HTTP call itself failed; a 4xx other than 429 does not
        record-failure-predicate: com.trieu.tripplanner.provider.resilience.ServiceFailure
    instances:
      photon:
        base-config: default
      nominatim:
        base-config: default
      osrm:
        base-config: default
      open-meteo:
        base-config: default
  ratelimiter:
    instances:
      # Terms of the public Nominatim server: at most one call a second, for the whole application
      nominatim:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 2s                    # how long a lookup waits for its turn before it fails
