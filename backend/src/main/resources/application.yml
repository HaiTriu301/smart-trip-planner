# Shared configuration for every profile.
# Environment-specific values (datasource, secrets, URLs) live in application-{profile}.yml.

spring:
  application:
    name: trip-planner
  threads:
    virtual:
      enabled: true               # @Async (mail) and request handling run on virtual threads (design.md 3.1)
  jpa:
    hibernate:
      ddl-auto: validate      # schema is owned by Flyway - never update/create here
    open-in-view: false       # no lazy loading outside transactions
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100      # ?size=500 is silently capped (design.md 10.2 "Quy ước Trip API")
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages                # src/main/resources/messages.properties
    encoding: UTF-8                   # Vietnamese user-facing messages (CLAUDE.md rule 14)
    fallback-to-system-locale: false  # unknown locale -> messages.properties, not the server OS locale

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json
  paths-to-match: /api/**             # document the public API only, hide actuator

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  mail-from: no-reply@smart-trip-planner.local
  jwt:
    secret: ${JWT_SECRET}        # >= 64 chars, never committed (see .env.example)
    access-ttl: 15m
    refresh-ttl: 7d
    issuer: smart-trip-planner
    cookie-secure: false         # prod profile sets true (cookie only over HTTPS)
  # Third-party implementations, selected by config (design.md 7.1).
  # Every profile defaults to mock so the app runs without any API key.
  providers:
    map: mock        # mock | osm
    weather: mock    # mock | open-meteo
    payment: mock    # mock | stripe
    ai: mock         # mock | claude
    storage: local   # local | cloudinary
    mail: mock       # mock | smtp  (local profile switches to smtp → MailHog; smtp needs spring.mail.host)