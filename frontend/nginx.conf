# nginx of the deployed site (design.md 17.4). The frontend image (frontend/Dockerfile) copies this file over the
# default site of the nginx image, /etc/nginx/conf.d/default.conf. It serves the built React app and forwards the
# API and Swagger to the backend container. Only HTTPS: Cloudflare turns http:// into https:// before it gets here
# and the Security Group does not open port 80 (WORKFLOW Task 4.8, decision 12).

server {
    listen 443 ssl;
    http2 on;
    # Any name: the domain is not written here, Cloudflare only sends requests for it anyway
    server_name _;

    # Cloudflare Origin Certificate, mounted read-only from /opt/trip-planner/certs by docker-compose.prod.yml.
    # Trusted by Cloudflare only, which is enough: browsers talk to Cloudflare, Cloudflare talks to us (SSL "Full (strict)")
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Do not tell the world which nginx version runs here
    server_tokens off;

    # ---- Real address of the visitor (design.md 6.3) ----
    # Every request arrives from a Cloudflare address. Cloudflare puts the visitor's address in CF-Connecting-IP;
    # nginx believes that header only when the request really comes from one of the ranges below, then uses it as
    # $remote_addr. A request from anywhere else keeps its own address, whatever header it sends.
    # Copied on 2026-10-21 from https://www.cloudflare.com/ips-v4/ and https://www.cloudflare.com/ips-v6/;
    # Cloudflare adds ranges from time to time: check those pages again every few months.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ---- Where the backend is ----
    # Ask Docker's own DNS (127.0.0.11) for "backend" at request time, through a variable. A plain
    # "proxy_pass http://backend:8080" looks the address up once at start: after a deploy the new backend container
    # can get another address and nginx would keep calling the old one (502) until restarted
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $backend http://backend:8080;

    # ---- Compression of text files ----
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ---- API and Swagger: forwarded to the backend ----
    # /actuator is not forwarded: the health check is only reachable inside the Docker network
    location ~ ^/(api/|swagger-ui|v3/api-docs) {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append ($proxy_add_x_forwarded_for would keep what the caller wrote first). After the
        # real_ip step above, $remote_addr is the visitor; Tomcat reads it back (forward-headers-strategy: native)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- The React app ----
    root /usr/share/nginx/html;

    location / {
        # Set here and not on the server: a location that sets add_header drops those of the server, and the API
        # responses already carry the same headers from Spring Security
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        # Not "no-referrer": the OpenStreetMap tile servers refuse map tiles requested without a Referer
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Paths of the app (/trips/12, /login...) are not files: answer them with index.html and let React Router
        # pick the page. index.html is never cached, so a deploy shows up at the next page load
        try_files $uri /index.html;
        expires -1;

        # Built files carry a hash in their name (index-3fa9c1.js): a new build gives new names, so they can be
        # cached for a year. A missing file is a real 404, not index.html
        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }
    }
}
